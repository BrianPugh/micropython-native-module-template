name: Build MicroPython Native Module

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:

jobs:
  build:
    name: "Build all architectures and mpy versions"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export module version
        run: |
          VERSION=$(git describe --tags --always)
          echo "Detected version is: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build native module
        uses: BrianPugh/build-mpy-native-module@v1
        with:
          # See https://github.com/BrianPugh/build-mpy-native-module for the
          # MPY subversion <-> MicroPython version mapping and all options.
          mpy-version: 6.2, 6.3
          architecture: all
          output-name: pythontemplate-${{ env.VERSION }}
          static-const-workaround: true

      - name: Display built artifacts
        run: ls -alh dist/*.mpy

      - name: Upload Native Module MPY Files
        uses: actions/upload-artifact@v4
        with:
          name: mpy-native-module-all
          path: "dist/*.mpy"

  test:
    name: "Test x64 mpy ${{ matrix.mpy_version }}"
    runs-on: ubuntu-latest
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runtime must match the mpy subversion to load native modules
          - mpy_version: "6.2"
            micropython_version: "v1.22.2"
          - mpy_version: "6.3"
            micropython_version: "v1.27.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Native Module Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mpy-native-module-all
          path: dist

      - name: Install MicroPython
        uses: BrianPugh/install-micropython@v2
        with:
          reference: ${{ matrix.micropython_version }}

      - name: Install Belay
        run: pipx install belay

      - name: Export module version
        run: |
          VERSION=$(git describe --tags --always)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run unit tests against the x64 module
        run: |
          cp "dist/pythontemplate-${VERSION}-mpy${{ matrix.mpy_version }}-x64.mpy" pythontemplate.mpy
          belay run micropython -X heapsize=200M -m unittest tests/test_*.py

  release_upload:
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export module version
        run: |
          VERSION=$(git describe --tags --always)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download All Native Module Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mpy-native-module-all
          path: mpy-native-modules

      - name: Display All Native Module Artifacts
        run: ls -alh mpy-native-modules

      - name: Create tarball of mpy files
        run: |
          tar -czvf "pythontemplate-${VERSION}.tar.gz" mpy-native-modules/*.mpy
          mv "pythontemplate-${VERSION}.tar.gz" mpy-native-modules/

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            mpy-native-modules/*
